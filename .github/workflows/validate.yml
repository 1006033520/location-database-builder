name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml
      - name: Unit tests
        run: python3 -m unittest discover -s tests/unit -v
      - name: Integration test (requires source cache)
        run: |
          python3 -m location_builder.cli download 2>/dev/null || true
          python3 -m unittest discover -s tests/integration -v
        env:
          PYTHONPATH: src
