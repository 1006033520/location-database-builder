# 美国：州(ADM1) -> 城市(PPL/PPLA/PPLA2 全量) -> 真实城市下级(PPLX，如纽约各区)
# FIX-003: county(ADM2) 不物化（独立产品决策，本轮不做）；
# allow_missing_district=true 表示单个城市允许没有 district —— 无 PPLX 下级的
# 城市（如 Los Angeles）直接结束在 level2，不再生成同名虚拟 district；
# city/district 两级 self fallback 全部关闭，虚拟节点趋近于 0。
country: US
province: [ADM1]
city: [PPL, PPLA, PPLA2]
district: [PPLX]
allow_missing_district: true
# 同县同名双记录（PPLA2 vs PPL）去重，保留 PPLA2
# 例：SC.047 下 Greenwood(PPLA2) 与 Greenwood Village(PPL) 只保留 PPLA2
# 注意 key 含 admin2（县），不会误删不同县的真实同名镇（如 AL.001/AL.035 两个 Evergreen）
dedupe_level2_by_name: true
dedupe_level2_key: admin2_name
self_level_fallback:
  city: false
  district: false
parent_resolution: [hierarchy, admin_code]
