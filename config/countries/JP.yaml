# 日本：都道府县(ADM1) -> 市区町村与特别区(ADM2/PPLA2) -> 政令指定都市的区(ADM3)
# FIX-002: PPLX（社区/町丁目/片区）不再映射为 district；district 仅取 ADM3。
# 东京 23 区（ADM2 特别区）自然结束在 level2：日本 -> 東京都 -> 渋谷区。
# 未设置 allow_missing_district -> 城市无 ADM3 时直接结束在 city 层（district
# fallback 关闭，禁止 "渋谷区 -> 渋谷区" 机械补齐）。
country: JP
province: [ADM1]
city: [ADM2, PPLA2]
district: [ADM3]
# JP 数据中同城实体可能同时以 ADM2 与 PPLA/PPLA2 出现（不同 geoname_id），
# 按 (admin1, admin2) 去重（同一城市 code），保留行政区实体（ADM2）
dedupe_level2_by_name: true
dedupe_level2_key: admin2
self_level_fallback:
  city: true
  district: false
parent_resolution: [hierarchy, admin_code]
