# Application language tags -> GeoNames alternate-name source language tags.
# Phase 1 scope: zh-Hans / ja / en (+ local fallback, always present).
languages:
  # FIX-005: zh-Hans 候选源按优先级 zh-Hans > zh-CN > zh > wuu/yue 选择 preferred
  #（优先级在 names.py ZH_SOURCE_PRIORITY 中实现）；wuu/yue 仅作补覆盖来源，
  # 且必须经 OpenCC 简繁转换后才可成为首选名。
  zh-Hans: [zh-Hans, zh-CN, zh, wuu, yue]
  en: [en, en-US, en-GB]
  ja: [ja]

# GeoNames alternateNames isolanguage tags that carry no linguistic value.
excluded_tags: [link, wk, wikipedia, iata, icao, post, abbr, unlc, geonames, iso639-3]
